<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Accueil</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <style>
    body {
      margin: 0;
      background: #0a0a0a;
      color: #fff;
      font-family: 'Segoe UI', sans-serif;
      overflow-x: hidden;
    }

    /* HEADER FIXE */
    header {
      position: fixed;
      top: 0;
      width: 100%;
      padding: 15px 40px;
      background: rgba(0, 0, 0, 0.9);
      backdrop-filter: blur(10px);
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 999;
      box-shadow: 0 2px 20px rgba(0, 255, 255, 0.1);
    }

    .profile-info {
      display: flex;
      align-items: center;
    }

    .profile-pic {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      border: 2px solid #1abc9c;
      margin-right: 15px;
      object-fit: cover;
    }

    .username {
      font-size: 1.2rem;
      font-weight: bold;
      color: #1abc9c;
    }

    nav a {
      margin-left: 25px;
      color: #0ff;
      text-decoration: none;
      font-weight: 500;
      transition: 0.3s ease;
    }

    nav a:hover {
      color: #1abc9c;
      text-shadow: 0 0 10px #1abc9c;
    }

    /* SECTION ACCUEIL */
    .hero {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding-top: 100px;
    }

    .intro-card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 40px;
      text-align: center;
      box-shadow: 0 0 30px rgba(0, 255, 255, 0.1);
      animation: fadeIn 1.5s ease;
      max-width: 500px;
    }

    .intro-card img {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #1abc9c;
      margin-bottom: 20px;
    }

    .intro-card h1 {
      font-size: 2.5rem;
      margin-bottom: 10px;
      color: #fff;
    }

    .intro-card p {
      font-size: 1rem;
      color: #ccc;
    }

    @keyframes fadeIn {
      0% { opacity: 0; transform: translateY(50px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    /* BOUTON */
    .btn-explore {
      margin-top: 25px;
      background-color: #1abc9c;
      color: #fff;
      border: none;
      padding: 12px 30px;
      border-radius: 30px;
      font-size: 1rem;
      transition: 0.3s ease;
    }

    .btn-explore:hover {
      background-color: #0ff;
      box-shadow: 0 0 15px #0ff;
    }

    /* RESPONSIVE */
    @media (max-width: 576px) {
      .intro-card {
        padding: 30px 20px;
      }

      nav a {
        margin-left: 15px;
        font-size: 0.9rem;
      }
    }
  </style>
</head>
<body>

  <!-- HEADER FIXE -->
  <header>
    <div class="profile-info">
      <img src="profil.jpg" alt="Profil" class="profile-pic"/>
      <span class="username">SENOU ABLAVI GLORIA</span>
    </div>
    <nav>
      <a href="index.html">Accueil</a>
      <a href="projet.html">Projets</a>
      <a href="apropos.html">A propos</a>
      <a href="contact.php">Contact</a>
    </nav>
  </header>

  <!-- SECTION ACCUEIL -->
  <section class="hero">
    <div class="intro-card">
      <img src="profil.jpg" alt="Photo de profil"/>
      <h1>Bienvenue, Ton Nom</h1>
      <p>Étudiant(e) passionné(e) par le développement web et les réseaux.<br>Explore mes projets, compétences et contacts.</p>
      <a href="projet.html" class="btn-explore">Explorer</a>
    </div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
